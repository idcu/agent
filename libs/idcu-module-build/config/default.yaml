# 通用模块构建系统 - 默认配置
# Default Configuration for Generic Module Build System

build:
  # 默认 C 标准
  c_standard: "99"
  
  # 默认库类型
  default_lib_type: "static"
  
  # 默认源文件路径
  src_pattern: "src/*.c"
  
  # 默认头文件路径
  include_dirs:
    - "include"

project:
  # 默认项目类型
  default_type: "generic_c_project"
  
  # 默认输出目录
  output_dir: "build/modules"

testing:
  # 是否默认构建测试
  build_tests: false
  
  # 测试文件模式
  test_pattern: "tests/test_*.c"

examples:
  # 是否默认构建示例
  build_examples: false
  
  # 示例文件模式
  example_pattern: "examples/example_*.c"

plugins:
  # 默认插件配置
  # 所有插件默认禁用，需要在 module.json 中显式启用
  defaults:
    version_generator: false
    signer: false
    coverage: false
    packager: false
    publisher: false
