name: idcu-microkernel
version: 1.0.0
description: Microkernel core library for IDCU Agent
author: IDCU Team
license: Apache-2.0

dependencies:
  - idcu-common
  - idcu-module-system
  - idcu-coroutine
  - idcu-msgbus

platform_link_libraries:
  unix:
    - pthread

build:
  type: cmake
  targets:
    - idcu-microkernel

features:
  - lifecycle: Kernel lifecycle management
  - integration: Integration of all core components
  - main_loop: Main event loop

testing:
  enabled: true
  framework: internal
