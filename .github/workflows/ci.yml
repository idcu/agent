name: IDCU Agent CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        compiler: [gcc, clang, msvc]
        exclude:
          - os: ubuntu-latest
            compiler: msvc
          - os: windows-latest
            compiler: gcc
          - os: windows-latest
            compiler: clang

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ninja-build
        if [ "${{ matrix.compiler }}" = "clang" ]; then
          sudo apt-get install -y clang
        fi

    - name: Configure CMake
      run: |
        cmake -B ${{ github.workspace }}/build \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DBUILD_TESTS=ON \
          -DBUILD_EXAMPLES=ON

    - name: Build
      run: |
        cmake --build ${{ github.workspace }}/build --config ${{ env.BUILD_TYPE }}

    - name: Test
      working-directory: ${{ github.workspace }}/build
      run: |
        ctest -C ${{ env.BUILD_TYPE }} --output-on-failure

  coverage:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ninja-build lcov

    - name: Configure CMake with coverage
      run: |
        cmake -B ${{ github.workspace }}/build-coverage \
          -DCMAKE_BUILD_TYPE=Debug \
          -DBUILD_TESTS=ON \
          -DBUILD_EXAMPLES=OFF \
          -DENABLE_CODE_COVERAGE=ON

    - name: Build
      run: |
        cmake --build ${{ github.workspace }}/build-coverage

    - name: Test
      working-directory: ${{ github.workspace }}/build-coverage
      run: |
        ctest --output-on-failure

    - name: Generate coverage report
      working-directory: ${{ github.workspace }}/build-coverage
      run: |
        lcov --directory . --capture --output-file coverage.info
        lcov --remove coverage.info '/usr/*' '*/tests/*' '*/examples/*' '*/testframework/*' --output-file coverage-filtered.info
        lcov --list coverage-filtered.info

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: ${{ github.workspace }}/build-coverage/coverage-filtered.info

  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Install clang-format and clang-tidy
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-format clang-tidy

    - name: Check code format
      run: |
        find . -name "*.c" -o -name "*.h" | xargs clang-format --dry-run --Werror

    - name: Run clang-tidy static analysis
      run: |
        mkdir -p build
        cd build
        cmake -DCMAKE_EXPORT_COMPILE_COMMANDS=ON ..
        cd ..
        find libs app modules tests tools -name "*.c" -o -name "*.h" | xargs clang-tidy -p build --quiet 2>&1 | tee clang-tidy-output.txt
        if [ -s clang-tidy-output.txt ]; then
          echo "clang-tidy found issues!"
          exit 1
        fi

  fuzzing:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ninja-build clang

    - name: Configure CMake with fuzzing
      run: |
        CC=clang CXX=clang++ cmake -B ${{ github.workspace }}/build-fuzz \
          -DCMAKE_BUILD_TYPE=Debug \
          -DBUILD_TESTS=ON \
          -DENABLE_FUZZING=ON

    - name: Build fuzzers
      run: |
        cmake --build ${{ github.workspace }}/build-fuzz

    - name: Run fuzz tests (short run)
      run: |
        # Run each fuzzer for a short time to check for crashes
        FUZZERS=(
          "fuzz_json"
          "fuzz_yaml"
          "fuzz_http"
          "fuzz_msgbus"
          "fuzz_config"
        )
        
        for fuzzer in "${FUZZERS[@]}"; do
          if [ -f "${{ github.workspace }}/build-fuzz/tests/fuzz/$fuzzer" ]; then
            echo "Running $fuzzer for 10 seconds..."
            timeout 10s "${{ github.workspace }}/build-fuzz/tests/fuzz/$fuzzer" -max_total_time=10 2>&1 || true
          fi
        done
