name: IDCU Agent CI

on:
  push:
    branches: [ main, master, develop, refactor/* ]
  pull_request:
    branches: [ main, master, develop, refactor/* ]

jobs:
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Clang Tools
      run: sudo apt-get update && sudo apt-get install -y clang-format clang-tidy

    - name: Run clang-format check
      run: |
        chmod +x scripts/check_format.sh
        ./scripts/check_format.sh

    - name: Configure CMake with clang-tidy
      run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_CLANG_TIDY=ON -DBUILD_TESTS=ON

    - name: Build with Clang-Tidy
      run: cmake --build build --config Debug

  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        build_type: [ Release, Debug ]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup CMake
      uses: lukka/get-cmake@latest

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBUILD_TESTS=ON -DBUILD_BENCHMARKS=ON

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: idcu-agent-${{ matrix.os }}-${{ matrix.build_type }}
        path: build/output/

  test:
    name: Run Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup CMake
      uses: lukka/get-cmake@latest

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON

    - name: Build Tests
      run: cmake --build build --config Debug

    - name: Run CTests
      working-directory: build
      run: ctest --output-on-failure --verbose

  coverage:
    name: Generate Code Coverage Report
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install coverage tools
      run: sudo apt-get update && sudo apt-get install -y lcov

    - name: Setup CMake
      uses: lukka/get-cmake@latest

    - name: Configure CMake with coverage
      run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON -DENABLE_CODE_COVERAGE=ON

    - name: Build with coverage
      run: cmake --build build --config Debug

    - name: Run coverage target
      run: cmake --build build --target coverage

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: build/coverage_report/

  performance:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup CMake
      uses: lukka/get-cmake@latest

    - name: Configure CMake with benchmarks
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_BENCHMARKS=ON

    - name: Build benchmarks
      run: cmake --build build --config Release

    - name: Run performance benchmarks
      run: |
        cd build/output/Release/bin || cd build/output/bin
        if [ -f ./idcu_benchmark ]; then
          ./idcu_benchmark
        fi

    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: |
          **/benchmark_*.json
          **/benchmark_result*.txt

