name: 功能建议
description: 提出一个新功能或改进建议
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        感谢你提出功能建议！请填写以下信息来帮助我们更好地理解你的想法。

  - type: checkboxes
    id: prerequisites
    attributes:
      label: 前提条件
      description: 请先确认以下事项
      options:
        - label: 我已搜索过现有的 Issues 和 Discussions，没有发现类似建议
          required: true
        - label: 我已阅读过项目的 [CONTRIBUTING.md](../../CONTRIBUTING.md) 文档
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 这个功能建议是为了解决什么问题？
      placeholder: 请描述你遇到的问题...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议的解决方案
      description: 你希望看到什么样的解决方案？
      placeholder: 请描述你的想法...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 可选方案
      description: 你考虑过其他替代方案吗？
      placeholder: 如果有，请描述...

  - type: textarea
    id: use-cases
    attributes:
      label: 使用场景
      description: 请提供一些使用场景示例
      value: |
        1. 场景1:
        2. 场景2:
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      description: 你认为这个功能的优先级如何？
      options:
        - 高 - 核心功能，必须实现
        - 中 - 重要功能，应该实现
        - 低 - 锦上添花，可以延后
    validations:
      required: true

  - type: textarea
    id: implementation
    attributes:
      label: 实现思路（可选）
      description: 如果你有实现思路，可以在这里分享
      placeholder: 可选的实现思路...

  - type: textarea
    id: additional-context
    attributes:
      label: 其他信息
      description: 还有其他想补充的信息吗？
