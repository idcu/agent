name: Bug 报告
description: 报告一个 Bug 来帮助我们改进项目
title: "[Bug]: "
labels: ["bug", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间报告这个 Bug！请填写以下信息来帮助我们更好地理解和修复问题。

  - type: checkboxes
    id: prerequisites
    attributes:
      label: 前提条件
      description: 请先确认以下事项
      options:
        - label: 我已搜索过现有的 Issues，没有发现类似问题
          required: true
        - label: 我已阅读过项目的 [CONTRIBUTING.md](../../CONTRIBUTING.md) 文档
          required: true

  - type: textarea
    id: description
    attributes:
      label: Bug 描述
      description: 请清晰描述遇到的问题
      placeholder: 发生了什么？
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: 复现步骤
      description: 请提供复现问题的详细步骤
      value: |
        1. 
        2. 
        3. 
      placeholder: 请提供详细步骤
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: 预期行为
      description: 你期望发生什么？
      placeholder: 正常情况下应该...
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: 实际行为
      description: 实际发生了什么？
      placeholder: 实际上...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 请提供你的运行环境信息
      value: |
        - 操作系统:
        - 编译器版本:
        - CMake 版本:
        - 项目版本/Commit Hash:
      render: markdown
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志和错误信息
      description: 请粘贴相关的错误日志或截图
      render: shell

  - type: textarea
    id: additional-context
    attributes:
      label: 其他信息
      description: 还有其他想补充的信息吗？
