# 日志集成配置
log:
  # 日志级别: debug, info, warn, error, fatal
  level: "info"

  # 日志文件路径（可选，不填则输出到 stdout）
  file: ""

  # 文件轮转配置
  rotation:
    enabled: true
    max_size: 10485760  # 10MB
    max_files: 10

  # 格式配置
  format:
    include_timestamp: true
    include_level: true
    include_module: true
