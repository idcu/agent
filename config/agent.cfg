# IDCU Agent 配置文件
# 版本：3.0.0 - 细粒度配置架构
#
# 配置说明：
# - 通过 [modules] 下的分类配置启用/禁用模块
# - 每个模块可以单独设置 enable_<模块名> 来启用/禁用
# - 每个模块可以设置 <模块名>.priority 来调整优先级 (low/normal/high/realtime)
# - 新增模块只需在对应分类下添加模块名，无需修改代码
# - 支持模块内部子功能的细粒度控制
# - 支持权限的细粒度配置
# - 支持配置分组和环境变量覆盖

[general]
# 系统版本号（只读，请勿修改）
version = 3.0.0

# 日志级别：控制日志输出的详细程度
# 可选值：debug（最详细，包含调试信息）、info（普通，日常使用推荐）、warn（警告，仅显示警告和错误）、error（错误，仅显示错误）
# 默认值：info
log_level = info

# 日志文件路径：指定日志输出的文件名
# 如果为空或不设置，则仅输出到控制台
# 默认值：agent.log
log_file = agent.log

# 最大模块数量：系统可同时加载的模块总数上限
# 根据系统资源和需求调整
# 默认值：32
max_modules = 32

# 消息队列大小：消息总线中可容纳的最大消息数
# 根据消息吞吐量调整
# 默认值：128
max_messages = 128

# 配置热重载开关：是否启用配置文件的运行时热重载
# true：配置文件修改后自动生效（需要配置验证）
# false：需要重启程序才能应用新配置
# 默认值：false
config_hot_reload = false

# 配置验证开关：是否对配置文件进行语法和语义验证
# true：启动时验证配置，错误则拒绝启动
# false：跳过验证，可能导致运行时错误
# 默认值：true
config_validate = true

# ==========================================
# 模块分类配置 (按优先级从低到高加载)
# ==========================================

[modules]
# Level 0: 核心基础模块 (Core Level)
# 最先加载，提供系统最基础的功能
# core = 模块名列表，用逗号分隔
core = base_log, core_module

# Level 1: 基础服务模块 (Foundation Level)
# 在核心模块之后加载，提供基础服务支持
foundation = 

# Level 2: 服务层模块 (Service Level)
# 提供监控、网络、安全等服务功能
monitoring = 
networking = 
security = 

# Level 3: 业务功能模块 (Business Level)
# 提供具体的业务功能，最后加载
business = biz_collect, heartbeat_module, healthcheck_module, metrics_module, alert_module, config_module, http_client_module, storage_module, cache_module, security_module

# Level 4: 扩展功能模块 (Extension Level)
# 可选的扩展功能，按需加载
extension = 

# ==========================================
# 模块启用/禁用配置
# ==========================================

# 核心模块 (通常保持启用)
# enable_<模块名> = true/false，控制模块是否加载
enable_base_log = true
enable_core_module = true

# 业务模块 (可根据需要启用/禁用)
enable_biz_collect = true
enable_heartbeat_module = true
enable_healthcheck_module = true
enable_metrics_module = true
enable_alert_module = true
enable_config_module = true
enable_http_client_module = true
enable_storage_module = true
enable_cache_module = true
enable_security_module = true

# ==========================================
# 模块优先级配置
# ==========================================
# <模块名>.priority = low/normal/high/realtime
# 优先级从低到高：low < normal < high < realtime
# 高优先级模块会更早加载和调度

base_log.priority = high
core_module.priority = realtime
biz_collect.priority = normal
heartbeat_module.priority = high
healthcheck_module.priority = normal
metrics_module.priority = normal
alert_module.priority = low
config_module.priority = high
http_client_module.priority = normal
storage_module.priority = normal
cache_module.priority = normal
security_module.priority = high

# ==========================================
# 模块权限配置 - 细粒度版本
# ==========================================

[permissions]
# 基础权限：send（发送消息）、recv（接收消息）、run（执行）、log（写日志）、config（读配置）、module_mgr（管理模块）、hw（硬件访问）
# 细粒度权限可以用点号分隔，例如：alert.send_email, alert.send_webhook

base_log = log,run
core_module = module_mgr,config,run
biz_collect = send,recv,run,hw
heartbeat_module = send,recv,run
healthcheck_module = send,recv,run
metrics_module = send,recv,run
alert_module = alert.send,alert.recv,alert.run,alert.send_email,alert.send_webhook,alert.send_sms
config_module = config,run
http_client_module = send,recv,run
storage_module = storage,run
cache_module = cache,run
security_module = security,run,tls

# ==========================================
# 资源配置
# ==========================================

[resources]
# 沙箱配额（字节）：每个沙箱环境的最大内存使用量
# 默认值：1048576 (1MB)
sandbox_quota = 1048576

# 协程默认优先级：新创建协程的默认优先级
# 可选值：low, normal, high, realtime
# 默认值：normal
coroutine_priority = normal

# 消息队列大小：每个模块的消息队列容量
# 默认值：128
msg_queue_size = 128

# 内存限制（字节）：整个系统的最大内存使用量
# 默认值：1073741824 (1GB)
memory_limit = 1073741824

# CPU 限制（百分比）：系统可使用的最大 CPU 百分比
# 默认值：80
cpu_limit = 80

# ==========================================
# 模块特定配置 (module.<模块名>) - 细粒度版本
# ==========================================

[module.heartbeat_module]
# 主开关
enabled = true
# 心跳间隔 (毫秒)
interval_ms = 5000
# 超时时间 (毫秒)
timeout_ms = 15000
# 心跳目标列表
targets = 127.0.0.1:8080,192.168.1.1:8080
# 重试次数
retry_count = 3
# 是否启用心跳响应检查
check_response = true

[module.healthcheck_module]
# 主开关
enabled = true
# 健康检查间隔 (毫秒)
check_interval_ms = 10000
# 告警阈值
alert_threshold = 3
# 检查项目分组配置
checks.cpu = true
checks.memory = true
checks.disk = true
checks.network = true
checks.process = true
# 各检查项的具体配置
checks.cpu.threshold = 90
checks.memory.threshold = 95
checks.disk.threshold = 90
checks.disk.paths = /,/data
checks.network.interfaces = eth0,eth1

[module.metrics_module]
# 主开关
enabled = true
# 采集间隔 (毫秒)
collection_interval_ms = 5000
# 导出开关
export_enabled = true
# 导出目标配置
export.prometheus = true
export.prometheus.port = 9090
export.influxdb = false
export.influxdb.url = http://localhost:8086
# 采集指标分组
metrics.cpu = true
metrics.memory = true
metrics.disk = true
metrics.network = true
metrics.process = true
metrics.custom = false

[module.alert_module]
# 主开关
enabled = true
# 通知 URL
notification_url = http://localhost:8080/alert
# 重试次数
retry_count = 3
# 告警级别配置
alert_levels.info = true
alert_levels.warning = true
alert_levels.error = true
alert_levels.critical = true
# 通知渠道配置 - 细粒度控制
channels.email.enabled = true
channels.email.smtp_server = smtp.example.com
channels.email.smtp_port = 587
channels.email.from = alert@example.com
channels.email.to = admin@example.com
channels.email.subject_prefix = [IDCU Alert]

channels.webhook.enabled = true
channels.webhook.url = http://webhook.example.com/alert
channels.webhook.timeout_ms = 5000
channels.webhook.retry_count = 2

channels.sms.enabled = false
channels.sms.provider = aliyun
channels.sms.access_key_id = ${SMS_ACCESS_KEY_ID}
channels.sms.access_key_secret = ${SMS_ACCESS_KEY_SECRET}
channels.sms.sign_name = IDCU
channels.sms.template_code = SMS_123456789
channels.sms.phone_numbers = 13800138000

channels.dingtalk.enabled = false
channels.dingtalk.webhook = https://oapi.dingtalk.com/robot/send?access_token=xxx
channels.dingtalk.secret = SECxxx
channels.dingtalk.at_mobiles = 13800138000
channels.dingtalk.is_at_all = false

# 告警规则配置
rules.cpu_high.enabled = true
rules.cpu_high.threshold = 90
rules.cpu_high.duration_ms = 60000
rules.cpu_high.channels = email,webhook

rules.memory_high.enabled = true
rules.memory_high.threshold = 95
rules.memory_high.duration_ms = 60000
rules.memory_high.channels = email,webhook,dingtalk

rules.disk_full.enabled = true
rules.disk_full.threshold = 90
rules.disk_full.duration_ms = 300000
rules.disk_full.channels = email,sms

# ==========================================
# 配置分组 - 便于开卡管理
# ==========================================

[profile.development]
# 开发环境配置
log_level = debug
alert_module.channels.email.enabled = false
alert_module.channels.webhook.enabled = false

[profile.production]
# 生产环境配置
log_level = info
config_hot_reload = true
alert_module.channels.email.enabled = true
alert_module.channels.sms.enabled = true
